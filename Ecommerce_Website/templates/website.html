<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProShop - E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url("https://plus.unsplash.com/premium_photo-1681488262364-8aeb1b6aac56?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8ZWNvbW1lcmNlfGVufDB8fDB8fHww") center/cover;
            height: 70vh;
            display: flex;
            align-items: center;
            color: white;
        }
        .product-card img {
            height: 200px;
            object-fit: cover;
        }
        .product-card:hover {
            transform: scale(1.02);
            transition: 0.3s;
        }
    </style>
</head>

<body>

<!-- 🔷 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="#">ProShop</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/selling">Sell Items</a></li>
            <li class="nav-item"><a class="nav-link" href="/categories">Categories</a></li>
            <li class="nav-item"><a class="nav-link" href="/Contact">Contact</a></li>
        </ul>

        <a href="{% url 'login' %}" class="btn btn-outline-light me-2">Login</a>
        <a href="/signup" class="btn btn-warning">Sign Up</a>
    </div>
</nav>

<!-- 🔷 HERO SECTION -->
<section class="hero text-center">
    <div class="container">
        <h1 class="display-3 fw-bold">Shop With the AI</h1>
        <p class="lead">Let AI do the checking for you.</p>
        <a href="/all-products" class="btn btn-lg btn-warning mt-3">Start Shopping</a>
    </div>
</section>

<!-- 🔷 FEATURED PRODUCTS SECTION -->
<section class="container my-5">
    <h2 class="text-center mb-4 fw-bold">Sample Products</h2>
    <div class="text-center mb-4">
</div>


    <div class="row g-4">

        <!-- PRODUCT CARD -->
        <div class="col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Q2FyfGVufDB8fDB8fHww" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Car</h5>
                    <p class="text-muted">₹7900000</p>
                    
                </div>
            </div>
        </div>

        <!-- PRODUCT CARD -->
        <div class="col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://plus.unsplash.com/premium_photo-1667538960104-25726d82a6e5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fGNhbWVyYSUyMGxlbnN8ZW58MHx8MHx8fDA%3D" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Camera Lens</h5>
                    <p class="text-muted">₹119000.99</p>
                    
                </div>
            </div>
        </div>

        <!-- PRODUCT CARD -->
        <div class="col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://images.unsplash.com/photo-1607270788732-55d2cdb8f52a?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTR8fFNtYXJ0JTIwUGhvbmV8ZW58MHx8MHx8fDA%3D" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Smart Phone</h5>
                    <p class="text-muted">₹58999.99</p>
                    
                </div>
            </div>
        </div>

        <!-- PRODUCT CARD -->
        <div class="col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://images.unsplash.com/photo-1585790050230-5dd28404ccb9?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8VGFibGV0c3xlbnwwfHwwfHx8MA%3D%3D" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Tablets</h5>
                    <p class="text-muted">₹24999.99</p>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- 🔷 FOOTER -->
<footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">© 2025 ProShop — All Rights Reserved</p>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
