<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
          crossorigin="anonymous">

    <title>Damage Detection</title>
  </head>

  <body class="container py-5">

    <h1 class="mb-4 text-center"><strong>Damage Detection System</strong></h1>

    <div class="mb-4 text-center">
      <p class="fw-bold">This model detects and classifies objects as:</p>
      <div class="d-flex flex-wrap justify-content-center gap-2">
          <span class="badge bg-danger">Damaged</span>
          <span class="badge bg-success">Undamaged</span>
      </div>
      <p class="text-muted mt-2">If any damaged region is found, bounding boxes will be displayed on the image.</p>
    </div>

    <div class="card shadow p-4">
      <form id="uploadForm" method="POST" action="/object_classification/" enctype="multipart/form-data" class="mb-3">
        {% csrf_token %}

        <div class="mb-3">
          <label for="userid" class="form-label fw-bold">Username</label>
          <input type="text" class="form-control" name="userid" id="userid" placeholder="Enter your name" required>
        </div>

        <div class="mb-3">
          <label for="image" class="form-label fw-bold">Upload an image</label>
          <input type="file" name="image" id="image" class="form-control" accept="image/*" required>
        </div>

        <div class="text-center mb-3">
          <img id="preview" class="img-thumbnail" style="max-width: 300px;" hidden>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary btn-lg">Detect Damage</button>
        </div>
      </form>

      <div id="result" class="alert mt-3 text-center" role="alert" hidden></div>
    </div>

    <script>
      const imageInput = document.getElementById('image');
      const preview = document.getElementById('preview');
      const resultDiv = document.getElementById('result');

      // Show preview on file select
      imageInput.addEventListener('change', function () {
        const file = imageInput.files[0];
        if (file) {
          preview.src = URL.createObjectURL(file);
          preview.hidden = false;
        } else {
          preview.hidden = true;
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
            crossorigin="anonymous"></script>
  </body>
</html>
