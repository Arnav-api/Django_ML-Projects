<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Product - ProShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }
        .form-card {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.10);
        }
    </style>
</head>

<body>

<!-- 🔷 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">ProShop</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'ecommerce' %}">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="{% url 'selling' %}">Sell Product</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'categories' %}">Categories</a></li>
        </ul>
    </div>
</nav>

<!-- 🔷 SUCCESS MESSAGE -->
{% if success %}    
<div class="alert alert-success text-center m-4">
    Your product has been submitted successfully!
</div>
{% endif %}

<!-- 🔷 SELL PRODUCT FORM -->
<div class="form-card">

    <h2 class="text-center mb-4 fw-bold">Sell Your Product</h2>

    <!-- FORM STARTS -->
    <form method="POST" action="{% url 'selling' %}" enctype="multipart/form-data">
    {% csrf_token %}


        <!-- Seller Name -->
        <div class="mb-3">
            <label class="form-label">Seller Name</label>
            <input type="text" class="form-control" name="seller_name" placeholder="Enter your name" required>
        </div>

        <!-- Mobile Number with Country Code Toggle -->
        <div class="mb-3">
            <label class="form-label">Mobile Number</label>

            <div class="input-group">
                <select class="form-select flex-shrink-1" style="max-width: 120px;" name="country_code" required>
                    <option value="+91" selected>+91 (IN)</option>
                    <option value="+1">+1 (USA)</option>
                    <option value="+44">+44 (UK)</option>
                    <option value="+61">+61 (AUS)</option>
                    <option value="other">Other</option>
                </select>

                <input type="tel" class="form-control" name="mobile" placeholder="Enter phone number" required>
            </div>

            <small class="text-muted">Your number will only be shared with interested buyers.</small>
        </div>

        <!-- Category -->
      <div class="mb-3">
    <label class="form-label">Product Category</label>
    <select class="form-select" name="category" required>
        <option value="">Select Category</option>
        <option value="Smartphones">Smartphones</option>
        <option value="Camera Lenses">Camera Lenses</option>
        <option value="Cars">Cars</option>
        <option value="Tablets">Tablets</option>
    </select>
</div>


        <!-- Price -->
        <div class="mb-3">
            <label class="form-label">Price (₹)</label>
            <input type="number" class="form-control" name="price" placeholder="Enter price" required>
        </div>

        <!-- Condition -->
        <div class="mb-3">
            <label class="form-label">Condition</label>
            <select class="form-select" name="condition" required>
                <option value="">Select Condition</option>
                <option>Brand New</option>
                <option>Like New</option>
                <option>Good</option>
                <option>Used</option>
                <option>Needs Repair</option>
            </select>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label class="form-label">Product Description</label>
            <textarea class="form-control" name="description" rows="4" placeholder="Enter a detailed description"></textarea>
        </div>

        <!-- File Upload -->
        <div class="mb-3">
            <label class="form-label">Upload Product Images</label>
            <input type="file" class="form-control" name="images" accept="image/*" multiple required>
            <small class="text-muted">Upload up to 5 clear images.</small>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-dark w-100 mt-3">Submit Product</button>

    </form>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">© 2025 ProShop — All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
