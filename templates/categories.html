        .category-card:hover {

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">

    <div class="row g-4">

            </div>
        </div>

        <!-- Camera Lenses -->
        <div class="col-md-3">
            <div class="card category-card shadow-sm">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f" class="card-img-top">
